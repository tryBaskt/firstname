name: Deploy Dev Infrastructure

on:
  push:
    branches: [dev, 'feature/*']
    paths:
      - 'infrastructure/dev/**'
      - '.github/workflows/terraform-dev.yml'
  pull_request:
    paths:
      - 'infrastructure/dev/**'
      - '.github/workflows/terraform-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.7'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test

  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' && github.ref_type == 'branch' &&
      (github.ref_name == 'dev' || startsWith(github.ref_name, 'feature/'))
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: firstname-dev-terraform
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.7'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '499133675835'
          role-session-name: firstname-dev-${{ github.run_id }}
      - run: terraform init -lockfile=readonly
      - run: terraform plan -lock-timeout=5m -out=deployment.tfplan
      - run: terraform apply -lock-timeout=5m deployment.tfplan
