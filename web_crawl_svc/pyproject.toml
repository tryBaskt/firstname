[project]
name = "firstname-web-crawler-svc"
version = "0.1.0"
description = "Internal crawling and parsing workers for FirstName"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.42,<2",
  "lxml>=6,<7",
  "markdown-it-py>=4,<5",
  "trafilatura>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "moto[dynamodb]>=5,<6",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "web_crawl_svc"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
